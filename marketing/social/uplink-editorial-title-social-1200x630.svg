<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Introducing Uplink Editorial Title</title>
  <desc id="desc">A branded social image showing expressive editorial typography and the title-formatting tools available in Uplink Editorial Title.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031a3a"/>
      <stop offset=".58" stop-color="#06265a"/>
      <stop offset="1" stop-color="#07336f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00102a" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1070" cy="96" r="210" fill="#1678d3" opacity=".11" filter="url(#soft)"/>
  <circle cx="735" cy="610" r="180" fill="#77b7f2" opacity=".08" filter="url(#soft)"/>
  <path d="M0 132H1200" stroke="#6aa9e4" stroke-opacity=".32"/>
  <path d="M66 568H735" stroke="#6aa9e4" stroke-opacity=".45"/>

  <!-- Uplink identity -->
  <rect x="64" y="38" width="70" height="70" rx="15" fill="#f5f7fa"/>
  <g transform="translate(75 48) scale(.0361)">
    <path d="M809.78 205.91h163.72c82.88 0 150.69 67.84 150.69 150.76s-67.84 150.76-150.69 150.76H777.75v205.91h195.78c196.07 0 356.47-160.48 356.47-356.68S1169.51 0 973.53 0H699.7c36.8 68.57 73.42 137.26 110.08 205.91Z" fill="#003362"/>
    <path d="M507.19 349.08v364.24c0 82.86-67.78 150.76-150.69 150.76s-150.69-67.84-150.69-150.76V356.64H0v356.71C0 909.49 160.4 1070 356.5 1070S713 909.52 713 713.35V348.93c12.8 4.39 26.27 9.52 40.64 15.25 27.75 11.09 58.99-11.99 44.25-43.13-55.1-103.09-107.69-202.01-163.2-305.25-11.32-21.04-38.05-21.04-49.34-.03-55.5 103.29-108.1 202.19-163.2 305.28-14.78 31.14 16.49 54.22 44.22 43.13 14.49-5.79 28.01-10.83 40.81-15.11Z" fill="#0071cc"/>
  </g>
  <text x="158" y="70" fill="#f4f8ff" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="28" font-weight="600">Uplink Plugins</text>
  <text x="160" y="96" fill="#9dc9f0" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="3.3">WORDPRESS EDITORIAL TOOLS</text>

  <!-- Main message -->
  <text x="64" y="205" fill="#9dc9f0" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="4.8">INTRODUCING</text>
  <text x="60" y="303" fill="#70afe9" font-family="Didot, New York, Georgia, serif" font-size="96" font-style="italic">Uplink</text>
  <text x="60" y="390" fill="#ffffff" font-family="New York, Didot, Georgia, serif" font-size="74">Editorial Title</text>
  <rect x="65" y="429" width="163" height="8" rx="4" fill="#f4cf3d"/>
  <text x="64" y="486" fill="#d8e9f8" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="23">Keep the canonical title clean.</text>
  <text x="64" y="522" fill="#d8e9f8" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="23">Give the display title a voice.</text>
  <text x="64" y="600" fill="#94c3ed" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="3.2">UPLINK.PRESS  ·  VERSION 1.0.1</text>

  <!-- Abstract editorial palette -->
  <g>
    <rect x="796" y="91" width="354" height="500" rx="28" fill="#00142f" opacity=".32"/>
    <rect x="782" y="73" width="354" height="500" rx="28" fill="url(#panel)"/>
    <rect x="799" y="90" width="320" height="56" rx="15" fill="#e9f1f9"/>
    <text x="821" y="124" fill="#183758" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">TITLE FORMAT PALETTE</text>

    <g fill="#15283d" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="31" text-anchor="middle">
      <text x="833" y="204" font-weight="800">B</text>
      <text x="887" y="204" font-family="Georgia, serif" font-style="italic" font-weight="700">I</text>
      <rect x="922" y="181" width="39" height="29" rx="4" fill="#f4cf3d"/>
      <text x="942" y="204" font-weight="600">A</text>
      <text x="997" y="204" font-weight="700" text-decoration="line-through">S</text>
      <text x="1053" y="201" font-weight="700">X<tspan dy="8" font-size="17">2</tspan></text>
      <text x="1100" y="201" font-weight="700">X<tspan dy="-10" font-size="17">2</tspan></text>
    </g>
    <path d="M811 232H1107" stroke="#c5d5e5"/>

    <text x="812" y="274" fill="#5e7185" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">DISPLAY TITLE</text>
    <rect x="811" y="292" width="296" height="174" rx="17" fill="#ffffff" stroke="#3d5afe" stroke-width="3"/>
    <text x="834" y="352" fill="#172e49" font-family="New York, Didot, Georgia, serif" font-size="36">A title with</text>
    <rect x="831" y="373" width="202" height="44" rx="5" fill="#f4cf3d" opacity=".95"/>
    <text x="835" y="409" fill="#0a3c70" font-family="Didot, New York, Georgia, serif" font-size="42" font-style="italic">editorial voice</text>
    <path d="M1081 331V429" stroke="#14283e" stroke-width="2"/>

    <circle cx="829" cy="512" r="6" fill="#0071cc"/>
    <text x="847" y="518" fill="#52687d" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="14">Safe inline formatting</text>
    <circle cx="829" cy="542" r="6" fill="#f4cf3d"/>
    <text x="847" y="548" fill="#52687d" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="14">Canonical title unchanged</text>
  </g>
</svg>
